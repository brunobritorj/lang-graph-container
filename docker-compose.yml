services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: langgraph
      POSTGRES_PASSWORD: langgraph
      POSTGRES_DB: langgraph
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langgraph -d langgraph"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  mcp-server:
    build: .
    command: ["python", "-m", "lang_graph_container.mcp_server"]
    environment:
      MCP_SERVER_HOST: 0.0.0.0
      MCP_SERVER_PORT: 8765
      MCP_SERVER_SOCKET_PATH: /sockets/mcp.sock
      MCP_SERVER_WORKSPACE: /app
      POSTGRES_URL: postgresql://langgraph:langgraph@postgres:5432/langgraph
    volumes:
      - mcp-sockets:/sockets
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: .
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      REDIS_URL: redis://redis:6379/0
      POSTGRES_URL: postgresql://langgraph:langgraph@postgres:5432/langgraph
      MCP_TRANSPORT: websocket
      MCP_WEBSOCKET_URL: ws://mcp-server:8765/mcp
      MCP_UNIX_SOCKET_PATH: /sockets/mcp.sock
      AZURE_OPENAI_API_VERSION: "2024-02-01"
      LANGGRAPH_AGENT_CONFIG_JSON: |
        [
          {
            "name": "planner",
            "azure_deployment": "gpt-4o-mini",
            "system_prompt": "You plan the work, decide whether tools are needed, and produce a short task breakdown.",
            "allowed_tools": ["filesystem_list", "browser_fetch", "postgres_health"],
            "default_next_agent": "researcher"
          },
          {
            "name": "researcher",
            "azure_deployment": "gpt-4o-mini",
            "system_prompt": "You reason over gathered evidence, call tools when necessary, and prepare execution-ready context.",
            "allowed_tools": ["filesystem_list", "browser_fetch", "postgres_health"],
            "default_next_agent": "executor"
          },
          {
            "name": "executor",
            "azure_deployment": "gpt-4o",
            "system_prompt": "You execute the final response using the current plan, memory, and tool results.",
            "allowed_tools": ["filesystem_list", "browser_fetch", "postgres_health"]
          }
        ]
    volumes:
      - mcp-sockets:/sockets
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mcp-server:
        condition: service_started

volumes:
  postgres-data:
  redis-data:
  mcp-sockets:
